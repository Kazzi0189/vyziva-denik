<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Výživa PRO v4</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root { --bg: #f8f9fa; --accent: #4a90e2; --danger: #e74c3c; --border: #dee2e6; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding-top: 180px; }
        header { position: fixed; top: 0; width: 100%; background: white; z-index: 2000; padding: 10px; border-bottom: 2px solid var(--border); box-sizing: border-box; }
        .controls { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .btn-v { background: var(--accent); }
        .btn-v.listening { background: var(--danger); animation: p 1s infinite; }
        #searchInput { flex-grow: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        thead th { position: sticky; top: 165px; background: #eee; padding: 10px; z-index: 1000; border-bottom: 2px solid #ccc; text-align: left; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        .m-input { min-height: 40px; outline: none; background: #fafafa; padding: 5px; border-radius: 4px; }
        .w-input { width: 60px; padding: 5px; border: 1px dashed #bbb; display: none; }
        .show-w .w-input { display: block; }
        .r-cell { font-size: 1.5rem; cursor: pointer; text-align: center; width: 50px; user-select: none; }
        @keyframes p { 50% { opacity: 0.5; } }
    </style>
</head>
<body>
<header>
    <div class="controls">
        <button style="background:#2ecc71" onclick="addRow()">Nový +</button>
        <button style="background:var(--danger)" onclick="delRow()">Smazat 🗑️</button>
        <button style="background:#9b59b6" onclick="document.body.classList.toggle('show-w')">Váha ⚖️</button>
        <button id="mic" class="btn-v" onclick="runVoice('main')">🎤 Hlas</button>
        <input type="text" id="searchInput" placeholder="Hledat..." oninput="search()">
        <button style="background:#34495e" onclick="runVoice('search')">🎙️</button>
    </div>
</header>
<div style="max-width:1200px; margin:0 auto; padding:0 10px;">
    <table>
        <thead><tr><th>Datum</th><th>Snídaně</th><th>⭐</th><th>Oběd</th><th>⭐</th><th>Večeře</th><th>⭐</th></tr></thead>
        <tbody id="b"></tbody>
    </table>
</div>
<script>
    const b = document.getElementById('b');
    const colors = { '☹️': '#ffe3e3', '🙂': '#e3f9e5', '😍': '#fff9db' };
    const emojis = ['🙂', '😍', '☹️'];

    window.onload = () => {
        const s = localStorage.getItem('nutri_v6');
        if(s) JSON.parse(s).reverse().forEach(d => render(d));
        else addRow();
    };

    function save() {
        const data = Array.from(b.rows).map(r => ({
            d: r.cells[0].innerText,
            m: [1,3,5].map(i => ({ t: r.cells[i].querySelector('.m-input').innerText, w: r.cells[i].querySelector('.w-input').value, r: r.cells[i+1].innerText }))
        }));
        localStorage.setItem('nutri_v6', JSON.stringify(data));
    }

    function render(d) {
        const r = document.createElement('tr');
        let h = `<td contenteditable="true" oninput="save()">${d.d || ''}</td>`;
        for(let i=0; i<3; i++) {
            const m = d.m ? d.m[i] : { t:'', w:'', r:'🙂' };
            h += `<td><div class="m-input" contenteditable="true" oninput="save()">${m.t}</div>
                  <input type="number" class="w-input" value="${m.w}" oninput="save()"></td>
                  <td class="r-cell" onclick="cycle(this)" style="background:${colors[m.r]}">${m.r}</td>`;
        }
        r.innerHTML = h; b.prepend(r);
    }

    function addRow() { render({ d: new Date().toLocaleDateString('cs-CZ'), m: null }); save(); }
    function delRow() { if(b.rows.length > 0 && confirm("Smazat?")) { b.deleteRow(0); save(); } }
    function cycle(el) { el.innerText = emojis[(emojis.indexOf(el.innerText)+1)%3]; el.style.background = colors[el.innerText]; save(); }

    function runVoice(mode) {
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!Rec) return;
        const rec = new Rec(); rec.lang = 'cs-CZ';
        if(mode==='main') document.getElementById('mic').classList.add('listening');
        rec.onresult = (e) => {
            const res = e.results[0][0].transcript.toLowerCase();
            if(mode==='search') { document.getElementById('searchInput').value = res; search(); return; }
            const active = document.activeElement;
            if(active && (active.classList.contains('m-input') || active.tagName === 'TD')) {
                active.innerText = res; save();
            } else {
                const r = b.rows[0];
                const map = { 'snídaně':1, 'oběd':3, 'večeře':5 };
                for(let k in map) {
                    if(res.startsWith(k)) {
                        let text = res.replace(k, '').trim();
                        let w = (text.match(/\d+/) || [""])[0];
                        let clean = text.replace(w, '').replace(/gramů|gramy|g\b/g, '').trim();
                        r.cells[map[k]].querySelector('.m-input').innerText = clean;
                        if(w) r.cells[map[k]].querySelector('.w-input').value = w;
                        save(); return;
                    }
                }
            }
        };
        rec.onend = () => document.getElementById('mic').classList.remove('listening');
        rec.start();
    }
    function search() {
        const v = document.getElementById('searchInput').value.toLowerCase();
        Array.from(b.rows).forEach(r => r.style.display = r.innerText.toLowerCase().includes(v) ? '' : 'none');
    }
    if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
