<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Výživa PRO 5.7</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root { --accent: #4a90e2; --danger: #e74c3c; --success: #2ecc71; --note: #f1c40f; }
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 0; background: #f4f7f6; }

        .sticky-header { position: fixed; top: 0; left: 0; right: 0; background: white; z-index: 2000; box-shadow: 0 2px 15px rgba(0,0,0,0.15); }
        .menu-content { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .app-title { font-size: 0.8rem; font-weight: bold; color: #7f8c8d; text-align: center; margin-bottom: 2px; }

        .btn-row { display: flex; gap: 4px; flex-wrap: wrap; }
        button { flex: 1; padding: 10px 2px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; font-size: 0.7rem; }
        
        .btn-mic { background: var(--accent); }
        .btn-mic.listening { animation: pulse 1s infinite; background: var(--danger) !important; }
        @keyframes pulse { 50% { opacity: 0.5; } }

        select { padding: 10px; border-radius: 8px; border: 1px solid #ddd; background: white; font-size: 0.85rem; flex-grow: 1; }

        .header-table { width: 100%; border-collapse: collapse; background: #e9ecef; table-layout: fixed; }
        .header-table th { padding: 8px 2px; border-bottom: 2px solid #dee2e6; font-size: 0.65rem; text-align: center; }

        .content-area { margin-top: 280px; }
        .main-table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        .main-table td { padding: 8px 3px; border-bottom: 1px solid #eee; vertical-align: top; overflow: hidden; }
        
        .m-box { min-height: 40px; padding: 5px; background: #fff; border: 1px solid #ddd; border-radius: 5px; outline: none; font-size: 0.9rem; word-break: break-word; }
        .w-box { width: 90%; margin-top: 4px; border: 1px dashed #bbb; border-radius: 4px; padding: 2px; font-size: 0.75rem; display: none; }
        .n-box { margin-top: 4px; padding: 4px; background: #fff9db; border: 1px solid #f1c40f; border-radius: 4px; font-size: 0.75rem; font-style: italic; display: none; }
        
        body.show-w .w-box { display: block; }
        body.show-n .n-box { display: block; }

        .rating { font-size: 1.2rem; text-align: center; cursor: pointer; border-radius: 5px; }
        .io-row { display: flex; gap: 5px; }
        .io-btn { background: #34495e; font-size: 0.6rem; padding: 5px; flex: 1; }
    </style>
</head>
<body>

<div class="sticky-header" id="topMenu">
    <div class="menu-content">
        <div class="app-title">Záznam o výživě (PRO 5.7 - Smart Date)</div>
        <div class="btn-row">
            <button style="background:var(--success)" onclick="addRow()">NOVÝ +</button>
            <button id="micMain" class="btn-mic" onclick="runVoice('food')">🎤 JÍDLO</button>
            <button id="micNote" style="background:var(--note)" class="btn-mic" onclick="runVoice('note')">🎤 POZNÁMKA</button>
            <button style="background:var(--danger)" onclick="delRow()">SMAZAT</button>
        </div>
        <div class="btn-row">
            <select id="filterSelect" onchange="setFilter(this.value)">
                <option value="all">Zobrazit: VŠE</option>
                <option value="currentWeek">Aktuální týden</option>
                <option value="lastWeek">Minulý týden</option>
                <option value="14days">Posledních 14 dní</option>
                <option value="lastMonth">Minulý měsíc</option>
            </select>
            <button style="background:#9b59b6; max-width: 60px;" onclick="document.body.classList.toggle('show-w')">⚖️ G</button>
            <button style="background:#f39c12; max-width: 60px;" onclick="document.body.classList.toggle('show-n')">📝 P</button>
        </div>
        <div class="io-row">
            <button class="io-btn" onclick="exportData()">💾 EXPORT</button>
            <button class="io-btn" onclick="document.getElementById('importFile').click()">📂 IMPORT</button>
            <input type="file" id="importFile" style="display:none" onchange="importData(event)">
        </div>
    </div>
    <table class="header-table">
        <thead>
            <tr>
                <th style="width:65px">DATUM</th>
                <th>SNÍDANĚ</th><th style="width:30px">⭐</th>
                <th>OBĚD</th><th style="width:30px">⭐</th>
                <th>SVAČINA</th><th style="width:30px">⭐</th>
                <th>VEČEŘE</th><th style="width:30px">⭐</th>
            </tr>
        </thead>
    </table>
</div>

<div class="content-area" id="content">
    <table class="main-table">
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const b = document.getElementById('tableBody');
    const topMenu = document.getElementById('topMenu');
    let currentFilter = 'all';
    let lastFocusedCell = null;
    const rates = {'🙂':'#e3f9e5','😍':'#fff9db','☹️':'#ffe3e3'};

    function adjustSpacing() { document.getElementById('content').style.marginTop = topMenu.offsetHeight + "px"; }
    window.onload = () => { load(); adjustSpacing(); };
    window.onresize = adjustSpacing;

    document.addEventListener('click', (e) => {
        if (e.target.hasAttribute('contenteditable') || e.target.tagName === 'TD') {
            lastFocusedCell = e.target;
        }
    }, true);

    function save() {
        const data = Array.from(b.rows).map(r => ({
            d: r.cells[0].innerText,
            m: [1,3,5,7].map(i => ({
                t: r.cells[i].querySelector('.m-box').innerText,
                w: r.cells[i].querySelector('.w-box').value,
                n: r.cells[i].querySelector('.n-box').innerText,
                r: r.cells[i+1].innerText
            }))
        }));
        localStorage.setItem('nutri_data_v12', JSON.stringify(data));
    }

    function load() {
        b.innerHTML = '';
        const saved = localStorage.getItem('nutri_data_v12');
        if (!saved) { addRow(); return; }
        let entries = JSON.parse(saved);
        const now = new Date();
        const filtered = entries.filter(e => {
            const p = e.d.split('.');
            const dDate = new Date(p[2], p[1]-1, p[0]);
            if (currentFilter === 'all') return true;
            const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            if (currentFilter === 'currentWeek') {
                const day = now.getDay() || 7; 
                const mon = new Date(startOfToday); mon.setDate(startOfToday.getDate() - day + 1);
                return dDate >= mon;
            }
            if (currentFilter === 'lastWeek') {
                const day = now.getDay() || 7;
                const lastMon = new Date(startOfToday); lastMon.setDate(startOfToday.getDate() - day - 6);
                const lastSun = new Date(lastMon); lastSun.setDate(lastMon.getDate() + 6);
                return dDate >= lastMon && dDate <= lastSun;
            }
            if (currentFilter === '14days') return (startOfToday - dDate) / 86400000 <= 14;
            if (currentFilter === 'lastMonth') {
                let lm = now.getMonth() - 1, ly = now.getFullYear();
                if (lm < 0) { lm = 11; ly--; }
                return dDate.getMonth() === lm && dDate.getFullYear() === ly;
            }
            return true;
        });
        filtered.reverse().forEach(e => render(e));
    }

    function render(e) {
        const r = document.createElement('tr');
        let html = `<td style="width:65px; font-size:0.7rem; font-weight:bold; color:var(--accent)" contenteditable="true" oninput="save()">${e.d}</td>`;
        for(let i=0; i<4; i++) {
            const m = (e.m && e.m[i]) ? e.m[i] : {t:'', w:'', n:'', r:'🙂'};
            html += `<td>
                <div class="m-box" contenteditable="true" oninput="save()">${m.t}</div>
                <input type="number" class="w-box" placeholder="g" value="${m.w}" oninput="save()">
                <div class="n-box" contenteditable="true" oninput="save()">${m.n}</div>
            </td>
            <td class="rating" onclick="cycle(this)" style="background:${rates[m.r]}">${m.r}</td>`;
        }
        r.innerHTML = html; b.prepend(r);
    }

    function addRow() { render({d: new Date().toLocaleDateString('cs-CZ'), m:null}); save(); }
    function delRow() { if(confirm("Smazat řádek?")) { (lastFocusedCell ? lastFocusedCell.closest('tr') : b.rows[0]).remove(); save(); } }
    function cycle(el) { const em = ['🙂','😍','☹️']; el.innerText = em[(em.indexOf(el.innerText)+1)%3]; el.style.background = rates[el.innerText]; save(); }
    function setFilter(v) { currentFilter = v; load(); }

    // POSÍLENÝ ČESKÝ PARSER DATA
    function parseSmartDate(text, currentVal) {
        const monthsMap = {
            "led":1, "úno":2, "bře":3, "dub":4, "kvě":5, "čer":6, "čvc":7, "srp":8, "zář":9, "říj":10, "lis":11, "pro":12,
            "prvn":1, "druh":2, "třet":3, "čtvr":4, "pát":5, "šest":6, "sedm":7, "osm":8, "devát":9, "desát":10, "jedenác":11, "dvanác":12
        };
        let val = text.toLowerCase();
        for (let m in monthsMap) {
            if (val.includes(m)) {
                val = val.replace(new RegExp(m + "[a-z]*", 'g'), " " + monthsMap[m] + ". ");
            }
        }
        const digits = val.match(/\d+/g);
        if (!digits || digits.length < 1) return currentVal;
        
        let d = digits[0];
        let m = digits[1] || (new Date().getMonth() + 1);
        let y = digits[2] || new Date().getFullYear();
        if (y.toString().length === 2) y = "20" + y;

        return `${d}.${m}.${y}`;
    }

    function runVoice(mode) {
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!Rec) return alert("Hlas není podporován");
        const rec = new Rec(); rec.lang = 'cs-CZ';
        const btnId = mode === 'note' ? 'micNote' : 'micMain';
        document.getElementById(btnId).classList.add('listening');

        rec.onresult = (ev) => {
            const res = ev.results[0][0].transcript.toLowerCase();
            const targetRow = lastFocusedCell ? lastFocusedCell.closest('tr') : b.rows[0];
            
            // Pokud diktujeme do buňky s DATEM
            if (lastFocusedCell && (lastFocusedCell.cellIndex === 0 || lastFocusedCell.closest('td')?.cellIndex === 0)) {
                const dateCell = targetRow.cells[0];
                dateCell.innerText = parseSmartDate(res, dateCell.innerText);
                save(); return;
            }

            // Rozpoznávání jídel - vylepšené hledání klíčových slov kdekoli v textu
            const keywords = {
                'snídaně': 1, 'snídani': 1,
                'oběd': 3,
                'svačina': 5, 'svačinu': 5,
                'večeře': 7, 'večeři': 7
            };

            for (let k in keywords) {
                if (res.includes(k)) {
                    let cellIndex = keywords[k];
                    let raw = res.replace(k, '').trim();
                    if (mode === 'note') {
                        targetRow.cells[cellIndex].querySelector('.n-box').innerText = raw;
                    } else {
                        let wMatch = raw.match(/\d+/);
                        let weight = wMatch ? wMatch[0] : "";
                        let food = raw.replace(weight, '').replace(/gramů|gramy|g\b/g, '').trim();
                        targetRow.cells[cellIndex].querySelector('.m-box').innerText = food;
                        if(weight) targetRow.cells[cellIndex].querySelector('.w-box').value = weight;
                    }
                    save(); return;
                }
            }
        };
        rec.onend = () => document.getElementById(btnId).classList.remove('listening');
        rec.start();
    }

    function exportData() {
        const data = localStorage.getItem('nutri_data_v12');
        const blob = new Blob([data], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `vyziva_zaloha_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => { localStorage.setItem('nutri_data_v12', e.target.result); load(); alert("Data byla úspěšně importována!"); };
        reader.readAsText(file);
    }
</script>
</body>
</html>
