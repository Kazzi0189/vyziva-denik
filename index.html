<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Výživa PRO 5.3</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root { 
            --accent: #4a90e2; --danger: #e74c3c; --success: #2ecc71; 
        }
        
        body { 
            font-family: -apple-system, sans-serif; 
            margin: 0; padding: 0;
            background: #f4f7f6; 
        }

        /* FIXNÍ KONTEJNER PRO CELÉ MENU I HLAVIČKU */
        .sticky-header {
            position: fixed; top: 0; left: 0; right: 0;
            background: white; z-index: 2000;
            box-shadow: 0 2px 15px rgba(0,0,0,0.15);
        }

        .menu-content { padding: 10px; display: flex; flex-direction: column; gap: 8px; }

        .app-title { 
            font-size: 0.85rem; font-weight: bold; color: #7f8c8d; 
            text-align: center; margin-bottom: 2px;
        }

        .btn-row { display: flex; gap: 6px; }
        button { 
            flex: 1; padding: 12px 2px; border: none; border-radius: 8px; 
            color: white; font-weight: bold; cursor: pointer; font-size: 0.75rem; 
        }
        
        .f-btn { background: #95a5a6; }
        .f-btn.active { background: var(--accent); outline: 2px solid #2c3e50; }

        #micMain.listening { animation: pulse 1s infinite; background: var(--danger) !important; }
        @keyframes pulse { 50% { opacity: 0.5; } }

        .search-wrap { display: flex; gap: 5px; }
        #search { flex-grow: 1; padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 0.9rem; }

        /* FIXACE HLAVIČKY TABULKY UVNITŘ STICKY KONTEJNERU */
        .header-table { width: 100%; border-collapse: collapse; background: #e9ecef; }
        .header-table th { 
            padding: 10px 5px; border-bottom: 2px solid #dee2e6; 
            font-size: 0.7rem; text-align: center; color: #333;
        }

        /* OBSAH TABULKY (SKROLOVACÍ ČÁST) */
        .content-area { margin-top: 240px; /* Bude upraveno JS dle výšky menu */ }
        .main-table { width: 100%; border-collapse: collapse; background: white; }
        .main-table td { padding: 10px 5px; border-bottom: 1px solid #eee; vertical-align: top; }
        
        .m-box { 
            min-height: 42px; padding: 6px; background: #fff; border: 1px solid #ddd; 
            border-radius: 6px; outline: none; font-size: 0.95rem; 
        }
        
        .w-box { width: 55px; margin-top: 5px; border: 1px dashed #bbb; border-radius: 4px; padding: 3px; font-size: 0.8rem; display: none; }
        body.show-w .w-box { display: block; }

        .rating { font-size: 1.4rem; text-align: center; cursor: pointer; width: 40px; border-radius: 6px; }

        @media (max-width: 600px) {
            .content-area { margin-top: 235px; }
        }
    </style>
</head>
<body>

<div class="sticky-header" id="topMenu">
    <div class="menu-content">
        <div class="app-title">Záznam o výživě (PRO 5.3 - Fixation Edition)</div>
        <div class="btn-row">
            <button style="background:var(--success)" onclick="addRow()">NOVÝ DEN +</button>
            <button id="micMain" style="background:var(--accent)" onclick="runVoice('auto')">🎤 HLAS</button>
            <button style="background:#9b59b6" onclick="document.body.classList.toggle('show-w')">⚖️ GRAMY</button>
            <button style="background:var(--danger)" onclick="delRow()">SMAZAT</button>
        </div>
        <div class="btn-row">
            <button class="f-btn active" onclick="setF('all', this)">VŠE</button>
            <button class="f-btn" onclick="setF('week', this)">TÝDEN</button>
            <button class="f-btn" onclick="setF('lastMonth', this)">MINULÝ MĚSÍC</button>
        </div>
        <div class="search-wrap">
            <input type="text" id="search" placeholder="Hledat v deníku..." oninput="doSearch()">
            <button style="background:#34495e; max-width: 45px;" onclick="runVoice('search')">🎙️</button>
        </div>
    </div>
    <table class="header-table">
        <thead>
            <tr>
                <th style="width:85px">DATUM</th>
                <th>SNÍDANĚ</th><th style="width:40px">⭐</th>
                <th>OBĚD</th><th style="width:40px">⭐</th>
                <th>VEČEŘE</th><th style="width:40px">⭐</th>
            </tr>
        </thead>
    </table>
</div>

<div class="content-area" id="content">
    <table class="main-table">
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const b = document.getElementById('tableBody');
    const content = document.getElementById('content');
    const topMenu = document.getElementById('topMenu');
    let filter = 'all';
    const rates = {'🙂':'#e3f9e5','😍':'#fff9db','☹️':'#ffe3e3'};

    // Automatické nastavení odsazení obsahu podle výšky menu
    function adjustSpacing() {
        content.style.marginTop = topMenu.offsetHeight + "px";
    }
    window.onload = () => { load(); adjustSpacing(); };
    window.onresize = adjustSpacing;

    function save() {
        const data = Array.from(b.rows).map(r => ({
            d: r.cells[0].innerText,
            m: [1,3,5].map(i => ({
                t: r.cells[i].querySelector('.m-box').innerText,
                w: r.cells[i].querySelector('.w-box').value,
                r: r.cells[i+1].innerText
            }))
        }));
        localStorage.setItem('nutri_data_v11', JSON.stringify(data));
    }

    function load() {
        b.innerHTML = '';
        const saved = localStorage.getItem('nutri_data_v11');
        if (!saved) { addRow(); return; }
        let entries = JSON.parse(saved);

        const now = new Date();
        const filtered = entries.filter(e => {
            if (filter === 'all') return true;
            const p = e.d.split('.');
            const d = new Date(p[2], p[1]-1, p[0]);
            if (filter === 'week') return (now - d) / 86400000 <= 7;
            if (filter === 'lastMonth') {
                let lm = now.getMonth() - 1; let ly = now.getFullYear();
                if (lm < 0) { lm = 11; ly--; }
                return d.getMonth() === lm && d.getFullYear() === ly;
            }
        });
        filtered.reverse().forEach(e => render(e));
    }

    function render(e) {
        const r = document.createElement('tr');
        let html = `<td style="width:85px" contenteditable="true" oninput="save()">${e.d}</td>`;
        for(let i=0; i<3; i++) {
            const m = e.m ? e.m[i] : {t:'', w:'', r:'🙂'};
            html += `<td><div class="m-box" contenteditable="true" oninput="save()">${m.t}</div>
                     <input type="number" class="w-box" placeholder="g" value="${m.w}" oninput="save()"></td>
                     <td class="rating" onclick="cycle(this)" style="background:${rates[m.r]}">${m.r}</td>`;
        }
        r.innerHTML = html; b.prepend(r);
    }

    function addRow() { render({d: new Date().toLocaleDateString('cs-CZ'), m:null}); save(); }
    function delRow() { if(confirm("Smazat horní řádek?")) { b.deleteRow(0); save(); } }
    
    function cycle(el) { 
        const em = ['🙂','😍','☹️']; el.innerText = em[(em.indexOf(el.innerText)+1)%3];
        el.style.background = rates[el.innerText]; save(); 
    }

    function setF(f, btn) {
        filter = f; document.querySelectorAll('.f-btn').forEach(x => x.classList.remove('active'));
        btn.classList.add('active'); load();
    }

    function runVoice(mode) {
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!Rec) return alert("Hlas není podporován");
        const rec = new Rec(); rec.lang = 'cs-CZ';
        if(mode==='auto') document.getElementById('micMain').classList.add('listening');

        rec.onresult = (ev) => {
            const res = ev.results[0][0].transcript.toLowerCase();
            if(mode==='search') { document.getElementById('search').value = res; doSearch(); return; }

            const r = b.rows[0];
            const map = {'snídaně':1, 'oběd':3, 'večeře':5};
            for (let k in map) {
                if (res.startsWith(k)) {
                    let text = res.replace(k,'').trim();
                    let w = (text.match(/\d+/) || [""])[0];
                    let clean = text.replace(w,'').replace(/gramů|gramy|g\b/g,'').trim();
                    r.cells[map[k]].querySelector('.m-box').innerText = clean;
                    if(w) r.cells[map[k]].querySelector('.w-box').value = w;
                    save(); return;
                }
            }
        };
        rec.onend = () => document.getElementById('micMain').classList.remove('listening');
        rec.start();
    }

    function doSearch() {
        const v = document.getElementById('search').value.toLowerCase();
        Array.from(b.rows).forEach(r => r.style.display = r.innerText.toLowerCase().includes(v) ? '' : 'none');
    }
</script>
</body>
</html>
